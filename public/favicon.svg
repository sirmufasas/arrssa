<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ARSSA brand favicon: A (white) R (gold) S (green) on deep navy -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a3160"/>
      <stop offset="1" stop-color="#0a1329"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#f2c200" stroke-opacity="0.55" stroke-width="2"/>
  <text x="32" y="43.5"
        font-family="Georgia, 'Times New Roman', serif"
        font-weight="bold"
        font-size="30"
        text-anchor="middle"
        letter-spacing="0.5">
    <tspan fill="#ffffff">A</tspan><tspan fill="#f2c200">R</tspan><tspan fill="#22c55e">S</tspan>
  </text>
  <rect x="18" y="50" width="28" height="2.5" rx="1.25" fill="#f2c200" opacity="0.9"/>
</svg>
