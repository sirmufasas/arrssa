<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a3160" />
    <title>ARSSA | Business Facilitation &amp; Trade Services South Africa–DRC</title>
    <meta
      name="description"
      content="ARSSA (Agence Rebi Service South Africa) provides business facilitation, market growth, distribution, import/export and compliance services for enterprises operating between South Africa and the DRC."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ARSSA | Business Facilitation & Trade Services South Africa–DRC" />
    <meta
      property="og:description"
      content="Your solution, right at your finger tips. Integrated business facilitation, market growth and trade services for the South Africa–DRC corridor."
    />
    <meta property="og:site_name" content="ARSSA" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#1a3160" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap"
      rel="stylesheet"
    />

    <!-- Static form definitions for Netlify detection (kept in sync with the live React forms) -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="message" />
    </form>

    <form name="enquiry" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="hidden" name="form-name" value="enquiry" />
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="country" />
      <input type="text" name="service" />
      <input type="text" name="industry" />
      <input type="text" name="scope" />
      <input type="text" name="hearing" />
      <input type="text" name="consent" />
      <input type="text" name="message" />
    </form>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
